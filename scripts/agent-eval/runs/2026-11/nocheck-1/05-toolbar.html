<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox</title>
<link rel="stylesheet" href="/lib/all.css">
</head>
<body>
<main data-tm-layout="center" data-tm-gap="md" data-tm-pad="lg">
  <div id="toolbar" role="toolbar" aria-label="Mail" data-tm-layout="row" data-tm-gap="sm" data-tm-wrap="none">
    <input id="search" type="search" data-tm-grow placeholder="Search mail" aria-label="Search mail">
    <button id="new" type="button" data-tm-icon="plus">New message</button>
    <button id="refresh" type="button" data-tm-variant="ghost" data-tm-icon="refresh-cw" aria-label="Refresh" data-tm-tooltip></button>
  </div>
  <ul data-tm-list>
    <li>Priya Raman: Quarterly report</li>
    <li>Mira Okafor: Climbing on Saturday?</li>
  </ul>
</main>
</body>
</html>
