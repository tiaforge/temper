<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications</title>
<link rel="stylesheet" href="/lib/all.css">
</head>
<body>
<main data-tm-layout="center" data-tm-gap="md" data-tm-pad="lg">
  <h1>Notifications</h1>
  <div data-tm-list>
    <label data-tm-layout="row" data-tm-justify="between">Email notifications <input id="notify" type="checkbox" role="switch" checked></label>
    <label data-tm-layout="row" data-tm-justify="between">Play sounds <input id="sounds" type="checkbox" role="switch"></label>
    <label data-tm-layout="row" data-tm-justify="between">Weekly digest <input id="digest" type="checkbox" role="switch" checked></label>
  </div>
</main>
</body>
</html>
