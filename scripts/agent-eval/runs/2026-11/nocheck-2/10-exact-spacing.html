<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spacing</title>
<link rel="stylesheet" href="/lib/all.css">
</head>
<body>
<main data-tm-layout="center" data-tm-pad="lg">
  <div data-tm-layout="grid" data-tm-cols="3" data-tm-gap="md">
    <article id="a" data-tm-layout="stack" data-tm-gap="sm" data-tm-pad="lg">
      <h3>Mail</h3>
      <p>4 unread messages.</p>
    </article>
    <article id="b" data-tm-layout="stack" data-tm-gap="sm" data-tm-pad="lg">
      <h3>Calendar</h3>
      <p>2 events today.</p>
    </article>
    <article id="c" data-tm-layout="stack" data-tm-gap="sm" data-tm-pad="lg">
      <h3>Contacts</h3>
      <p>1 new contact.</p>
    </article>
  </div>
</main>
</body>
</html>
