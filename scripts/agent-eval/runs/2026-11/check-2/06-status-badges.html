<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoices</title>
<link rel="stylesheet" href="/lib/all.css">
</head>
<body>
<main data-tm-layout="center" data-tm-pad="lg">
  <section data-tm-layout="stack" data-tm-gap="md">
    <h1>Invoice status</h1>
    <div data-tm-layout="row" data-tm-gap="sm">
      <span id="paid" data-tm-badge data-tm-tone="success">Paid</span>
      <span id="due" data-tm-badge data-tm-tone="warning">Due soon</span>
      <span id="overdue" data-tm-badge data-tm-tone="danger">Overdue</span>
    </div>
  </section>
</main>
</body>
</html>
