<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications</title>
<link rel="stylesheet" href="/lib/all.css">
</head>
<body>
<main data-tm-layout="center" data-tm-pad="lg">
  <section data-tm-layout="stack" data-tm-gap="md">
    <h1>Notifications</h1>
    <div data-tm-layout="stack" data-tm-gap="none">
      <label data-tm-layout="row" data-tm-justify="between" data-tm-pad="sm">Email notifications <input id="notify" type="checkbox" role="switch" checked></label>
      <label data-tm-layout="row" data-tm-justify="between" data-tm-pad="sm">Play sounds <input id="sounds" type="checkbox" role="switch"></label>
      <label data-tm-layout="row" data-tm-justify="between" data-tm-pad="sm">Weekly digest <input id="digest" type="checkbox" role="switch" checked></label>
    </div>
  </section>
</main>
</body>
</html>
