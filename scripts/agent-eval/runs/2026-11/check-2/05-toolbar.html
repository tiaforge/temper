<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox</title>
<link rel="stylesheet" href="/lib/all.css">
</head>
<body>
<main data-tm-layout="center" data-tm-pad="lg">
  <div data-tm-layout="stack" data-tm-gap="md">
    <div id="toolbar" role="toolbar" aria-label="Mail" data-tm-layout="row" data-tm-gap="sm" data-tm-align="center" data-tm-wrap="none">
      <input id="search" type="search" data-tm-grow placeholder="Search mail" aria-label="Search mail">
      <button type="button" id="new" data-tm-icon="plus">New message</button>
      <button type="button" id="refresh" data-tm-variant="ghost" data-tm-icon="refresh-cw" aria-label="Refresh"></button>
    </div>
    <ul data-tm-list aria-label="Messages">
      <li>Priya Raman: Quarterly report</li>
      <li>Mira Okafor: Climbing on Saturday?</li>
    </ul>
  </div>
</main>
</body>
</html>
