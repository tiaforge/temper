<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Rows</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../../../src/all.css"></head>
<body data-tm-layout="stack" data-tm-pad="lg">
<button commandfor="f" command="show-modal">Open form</button>
<dialog id="f"><header><h2>New contact</h2><button commandfor="f" command="close" aria-label="Close"></button></header>
  <fieldset><legend>Email</legend>
    <div data-tm-layout="row" data-tm-gap="xs"><input type="email" data-tm-grow aria-label="Email" value="mira@okafor.io">
      <select aria-label="Type"><option>Private</option><option>Work</option><option>Other</option></select>
      <button data-tm-icon data-tm-variant="ghost" aria-label="Remove">×</button></div>
  </fieldset>
  <footer><button data-tm-variant="secondary" commandfor="f" command="close">Cancel</button><button>Save</button></footer>
</dialog>
<div data-tm-layout="grid" style="--tm-min: 12rem"><article><span data-tm-avatar>MO</span><button data-tm-stretch data-tm-variant="link" commandfor="f" command="show-modal">Mira Okafor</button></article></div>
<button popovertarget="m" data-tm-variant="outline">Books</button><div popover id="m" data-tm-menu><label><input type="checkbox"> Personal</label></div>
</body></html>
