name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # every Node version reports its own result instead of being cancelled by the first failure
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # gen --check (generated docs, types and icons are current), unit tests, type fixtures
      - run: npm test
        env:
          # failing tests also become annotations on the run page (scripts/github-reporter.mjs)
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/github-reporter.mjs --test-reporter-destination=stdout
      # size budgets
      - run: npm run build
      # the kitchen sink passes its own checker
      - run: npm run check
      - run: npm pack --dry-run
