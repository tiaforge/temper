name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # gen --check (generated docs, types and icons are current), unit tests, type fixtures
      - run: npm test
      # size budgets
      - run: npm run build
      # the kitchen sink passes its own checker
      - run: npm run check
      - run: npm pack --dry-run
