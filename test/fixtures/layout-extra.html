<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Containers, sticky bars, joined groups, card media</title>
<link rel="stylesheet" href="../../src/core.css">
<link rel="stylesheet" href="../../src/app.css">
<link rel="stylesheet" href="../../src/table.css">
<link rel="stylesheet" href="../../src/forms.css">
<link rel="stylesheet" href="../../src/icons.css">
<style>
  /* an app's own container: data-show must not follow it */
  .own { container-type: inline-size; inline-size: 20rem; }
</style>
</head>
<body>
<main data-layout="stack" data-gap="md" data-pad="md">
  <!-- data-show: the screen, a data-container, nested containers, the container itself, an app's own container -->
  <span data-show="narrow" id="vp-narrow">narrow</span><span data-show="wide" id="vp-wide">wide</span>
  <div data-container style="inline-size: 20rem" id="c-narrow">
    <span data-show="narrow" id="cn-narrow">narrow</span><span data-show="wide" id="cn-wide">wide</span>
  </div>
  <div style="overflow: hidden"><div data-container style="inline-size: 60rem" id="c-wide">
    <span data-show="narrow" id="cw-narrow">narrow</span><span data-show="wide" id="cw-wide">wide</span>
    <div data-container style="inline-size: 20rem">
      <span data-show="narrow" id="nest-narrow">narrow</span><span data-show="wide" id="nest-wide">wide</span>
    </div>
  </div></div>
  <div data-container data-show="narrow" style="inline-size: 60rem" id="self">self</div>
  <div class="own"><span data-show="narrow" id="own-narrow">narrow</span><span data-show="wide" id="own-wide">wide</span></div>

  <!-- data-sticky in a data-scroll="y" pane, above a sticky table header -->
  <div data-scroll="y" data-layout="stack" data-gap="none" style="block-size: 15rem" id="pane">
    <div data-sticky="top" data-pad="sm" id="bar-top"><button id="bar-button">Export</button></div>
    <table>
      <thead><tr><th scope="col" id="th">Name</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <footer data-sticky="bottom" data-pad="sm" id="bar-bottom"><button>Save</button></footer>
  </div>

  <!-- data-join -->
  <div data-join role="group" aria-label="Actions" id="j-outline">
    <button data-variant="outline" data-icon="archive" aria-label="Archive" id="o1"></button>
    <button data-variant="outline" data-icon="folder" aria-label="Move" id="o2"></button>
    <button data-variant="outline" data-icon="trash-2" aria-label="Delete" id="o3"></button>
  </div>
  <div data-join id="j-solid"><button id="s1">Send</button><button data-icon="chevron-down" aria-label="More" id="s2"></button></div>
  <div data-join id="j-secondary"><button data-variant="secondary" id="v1">Day</button><button data-variant="secondary" id="v2">Week</button></div>
  <div data-join data-size="sm" id="j-sm"><input aria-label="q" id="sm-input"><button id="sm-button">Go</button></div>
  <div data-join data-size="lg" id="j-lg"><select aria-label="p" id="lg-select"><option>One</option></select><button data-variant="outline" id="lg-button">Go</button></div>
  <div data-join data-density="compact" id="j-compact"><div data-field id="c-field"><input aria-label="q"></div><button id="c-button">Copy</button></div>
  <div data-layout="row"><form data-join data-grow id="j-grow"><input type="search" data-grow aria-label="Search" id="g-input"><button id="g-button">Search</button></form></div>

  <!-- card media -->
  <div data-layout="grid" data-gap="md" style="--tm-min: 15rem">
    <article data-layout="stack" data-gap="sm" id="card"><img id="card-img" width="160" height="90" alt="x" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 9'%3E%3Crect width='16' height='9' fill='%23c00'/%3E%3C/svg%3E"><p id="card-text">Text</p></article>
    <article data-pad="sm" id="card-pad"><img id="pad-img" width="160" height="90" alt="x" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 9'%3E%3Crect width='16' height='9' fill='%23c00'/%3E%3C/svg%3E"></article>
    <article id="card-picture"><picture id="pic"><img id="pic-img" width="160" height="90" alt="x" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 9'%3E%3Crect width='16' height='9' fill='%23c00'/%3E%3C/svg%3E"></picture></article>
    <article id="card-second"><p>First</p><img id="second-img" width="160" height="90" alt="x" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 9'%3E%3Crect width='16' height='9' fill='%23c00'/%3E%3C/svg%3E"></article>
    <article data-layout="stack" id="card-stretch"><img id="stretch-img" width="160" height="90" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 9'%3E%3Crect width='16' height='9' fill='%23c00'/%3E%3C/svg%3E"><a href="#x" data-stretch id="stretch">Open</a></article>
  </div>

  <!-- restyle cost: long containers of the new kinds -->
  <div data-join id="perf-join"></div>
  <div data-container id="perf-container"></div>
  <article id="perf-card"></article>
</main>
<script>
  document.getElementById('rows').innerHTML = Array.from({ length: 30 }, (_, i) => `<tr><td>Row ${i}</td></tr>`).join('');
  const N = 300, fill = (id, row) => { document.getElementById(id).innerHTML = Array.from({ length: N }, (_, i) => row(i)).join(''); };
  fill('perf-join', i => `<button data-variant="outline">${i}</button>`);
  fill('perf-container', i => `<p><span data-show="wide">Wide ${i}</span><span data-show="narrow">Narrow ${i}</span></p>`);
  fill('perf-card', i => i ? `<p>Paragraph ${i}</p>` : `<img alt="" width="16" height="9" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 9'/%3E">`);
</script>
</body>
</html>
