<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Split panes in a fixed shell</title>
<link rel="stylesheet" href="../../src/core.css">
<link rel="stylesheet" href="../../src/app.css">
<link rel="stylesheet" href="../../src/icons.css">
</head>
<!-- the markup of the "Panes that adapt to their own width" recipe (llms-full.txt) in a data-tm-shell="fixed" app -->
<body data-tm-shell="fixed">
  <nav data-tm-rail popover id="rail" aria-label="Main"><a href="#" data-tm-icon="mail"><span>Mail</span></a></nav>
  <main data-tm-layout="split" data-tm-wrap="none" data-tm-gap="none" id="main">
    <section data-tm-scroll="y" style="--tm-split: 22rem" id="list">
      <header data-tm-sticky="top" data-tm-layout="row" data-tm-gap="xs" data-tm-pad="sm">
        <button popovertarget="rail" data-tm-show="narrow" id="menu" data-tm-icon="menu" data-tm-variant="ghost" aria-label="Open menu"></button>
        <h1>Inbox</h1>
      </header>
      <p style="block-size: 3000px">…message list…</p>
    </section>
    <section data-tm-scroll="y" data-tm-container data-tm-show="wide" id="reader">
      <header data-tm-sticky="top" data-tm-layout="row" data-tm-gap="xs" data-tm-pad="sm">
        <h2 data-tm-grow data-tm-truncate>Quarterly report</h2>
        <button data-tm-show="wide" data-tm-icon="archive" data-tm-variant="ghost">Archive</button>
        <button data-tm-show="narrow" data-tm-icon="archive" data-tm-variant="ghost" aria-label="Archive"></button>
      </header>
      <p style="block-size: 5000px">…message…</p>
    </section>
  </main>
</body>
</html>
