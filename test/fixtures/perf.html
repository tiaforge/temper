<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Style recalc cost</title>
<link rel="stylesheet" href="../../src/core.css">
<link rel="stylesheet" href="../../src/app.css">
<link rel="stylesheet" href="../../src/menu.css">
<link rel="stylesheet" href="../../src/feedback.css">
<link rel="stylesheet" href="../../src/table.css">
<link rel="stylesheet" href="../../src/icons.css">
</head>
<body>
<main data-layout="stack" data-pad="md">
  <!-- split: a <template> on either side must not count as the sidebar or the content -->
  <div data-layout="split" id="split">
    <template><p>row</p></template>
    <nav id="side">Sidebar</nav>
    <section id="middle">Middle</section>
    <section id="content">Content</section>
    <template><p>row</p></template>
  </div>
  <div data-layout="split" id="split2"><nav id="side2">Sidebar</nav><section id="content2">Content</section></div>
  <!-- long containers of every common kind; filled below. One child added or removed must not restyle the others -->
  <ul id="ul"></ul>
  <div id="div"></div>
  <ul data-list id="list"></ul>
  <table><tbody id="tbody"></tbody></table>
  <div id="checks" data-layout="stack"></div>
  <div id="toasts"></div>
  <!-- icons and reduced motion -->
  <span id="mail" data-icon="mail"></span>
  <span id="rocket" data-icon="rocket"></span>
  <details id="details"><summary>More</summary>Text</details>
</main>
<script>
  const N = 300, fill = (id, row) => { document.getElementById(id).innerHTML = Array.from({ length: N }, (_, i) => row(i)).join(''); };
  fill('ul', i => `<li>Person ${i}</li>`);
  fill('div', i => `<p>Paragraph ${i}</p>`);
  fill('list', i => `<li>Row ${i}</li>`);
  fill('tbody', i => `<tr><td><input type="checkbox" aria-label="Select"></td><td>Row ${i}</td></tr>`);
  fill('checks', i => `<label><input type="checkbox"> Option ${i}</label>`);
  fill('toasts', i => `<div data-toast><span>Saved ${i}</span><button type="button">Undo</button></div>`);
</script>
</body>
</html>
