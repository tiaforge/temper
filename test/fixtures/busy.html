<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Busy states</title>
<link rel="stylesheet" href="../../src/core.css">
</head>
<body>
<main data-layout="stack" data-pad="md">
  <!-- what sinter does: aria-busy on the element of an action while its request runs -->
  <button id="save" type="button">Save</button>
  <button id="item" type="button" data-variant="item">Inbox</button>
  <form id="form" data-layout="stack"><label>Name <input></label></form>
  <!-- the resource pattern: <p data-sn-show="$meta.x.loading" aria-busy="true">Loading…</p> -->
  <p id="loading" aria-busy="true" hidden>Loading…</p>
</main>
</body>
</html>
