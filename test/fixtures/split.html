<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Splitter</title>
<link rel="stylesheet" href="../../src/core.css">
<link rel="stylesheet" href="../../src/drag.css">
</head>
<body>
<div data-tm-layout="row" data-tm-wrap="none" data-tm-gap="none" style="block-size: 200px" id="cols">
  <div style="inline-size: 200px">Folders</div>
  <div role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize folders" aria-valuenow="200" id="v"></div>
  <div data-tm-grow>Messages</div>
</div>
<div data-tm-layout="stack" data-tm-gap="none" style="block-size: 300px">
  <div style="block-size: 100px">Top</div>
  <div role="separator" tabindex="0" aria-label="Resize top" aria-valuenow="100" id="h"></div>
  <div data-tm-grow>Bottom</div>
</div>
</body>
</html>
